<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StockWatch Push Test</title>
</head>
<body>

<h1>StockWatch Push Test</h1>

<button id="subscribeButton">
    Enable Notifications
</button>

<button id="unsubscribeButton">
    Disable Notifications
</button>

<p id="status"></p>

<script>
    const subscribeButton =
        document.getElementById("subscribeButton");

    const unsubscribeButton =
        document.getElementById("unsubscribeButton");

    const statusElement =
        document.getElementById("status");

    subscribeButton.addEventListener(
        "click",
        subscribeToPush
    );

    unsubscribeButton.addEventListener(
        "click",
        unsubscribeFromPush
    );


    async function subscribeToPush() {

        try {

            if (!("serviceWorker" in navigator)) {
                throw new Error(
                    "Service workers are not supported by this browser."
                );
            }

            if (!("PushManager" in window)) {
                throw new Error(
                    "Push notifications are not supported by this browser."
                );
            }

            statusElement.textContent =
                "Registering service worker...";

            const registration =
                await navigator.serviceWorker.register(
                    "/service-worker.js"
                );

            statusElement.textContent =
                "Requesting notification permission...";

            const permission =
                await Notification.requestPermission();

            if (permission !== "granted") {
                throw new Error(
                    "Notification permission was not granted."
                );
            }

            statusElement.textContent =
                "Loading VAPID public key...";

            const keyResponse =
                await fetch(
                    "/api/push/public-key"
                );

            if (!keyResponse.ok) {
                throw new Error(
                    "Failed to retrieve VAPID public key."
                );
            }

            const keyData =
                await keyResponse.json();

            const applicationServerKey =
                urlBase64ToUint8Array(
                    keyData.publicKey
                );

            let subscription =
                await registration.pushManager
                    .getSubscription();

            if (!subscription) {

                statusElement.textContent =
                    "Creating browser subscription...";

                subscription =
                    await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey:
                        applicationServerKey
                    });
            }

            const subscriptionJson =
                subscription.toJSON();

            const requestBody = {
                endpoint:
                subscriptionJson.endpoint,

                p256dh:
                subscriptionJson.keys.p256dh,

                auth:
                subscriptionJson.keys.auth
            };

            statusElement.textContent =
                "Saving subscription...";

            const saveResponse =
                await fetch(
                    "/api/push-subscriptions",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                requestBody
                            )
                    }
                );

            if (!saveResponse.ok) {
                throw new Error(
                    "Backend rejected the push subscription."
                );
            }

            statusElement.textContent =
                "Push subscription saved successfully.";

        } catch (error) {

            console.error(error);

            statusElement.textContent =
                "Error: " + error.message;
        }
    }


    async function unsubscribeFromPush() {

        try {

            const registration =
                await navigator.serviceWorker.ready;

            const subscription =
                await registration.pushManager
                    .getSubscription();

            if (!subscription) {

                statusElement.textContent =
                    "No active push subscription found.";

                return;
            }

            const endpoint =
                subscription.endpoint;

            statusElement.textContent =
                "Removing subscription from backend...";

            const response =
                await fetch(
                    "/api/push-subscriptions?endpoint="
                    + encodeURIComponent(endpoint),
                    {
                        method: "DELETE"
                    }
                );

            if (!response.ok) {
                throw new Error(
                    "Failed to remove subscription from backend."
                );
            }

            statusElement.textContent =
                "Unsubscribing browser...";

            const unsubscribed =
                await subscription.unsubscribe();

            if (!unsubscribed) {
                throw new Error(
                    "Browser could not unsubscribe."
                );
            }

            statusElement.textContent =
                "Notifications disabled successfully.";

        } catch (error) {

            console.error(error);

            statusElement.textContent =
                "Error: " + error.message;
        }
    }


    function urlBase64ToUint8Array(
        base64String
    ) {

        const padding =
            "=".repeat(
                (4 - base64String.length % 4) % 4
            );

        const base64 =
            (base64String + padding)
                .replace(/-/g, "+")
                .replace(/_/g, "/");

        const rawData =
            window.atob(base64);

        return Uint8Array.from(
            [...rawData]
                .map(character =>
                    character.charCodeAt(0)
                )
        );
    }
</script>

</body>
</html>
