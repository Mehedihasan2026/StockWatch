spring.application.name=StockWatch
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=false
server.port=8081

stockwatch.push.vapid-public-key=${VAPID_PUBLIC_KEY}
stockwatch.push.vapid-private-key=${VAPID_PRIVATE_KEY}
stockwatch.push.vapid-subject=${VAPID_SUBJECT}

stockwatch.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ===============================
# SESSION
# ===============================

# Store login sessions in MySQL so deployments/restarts
# do not automatically log users out.
spring.session.jdbc.initialize-schema=never

# Effectively persistent login.
# User stays signed in unless they explicitly log out.
spring.session.timeout=3650d

# Keep the browser cookie after browser restart.
server.servlet.session.cookie.max-age=3650d

# Keep the existing cookie name used by StockWatch.
server.servlet.session.cookie.name=JSESSIONID

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax