name: StockWatch CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockwatch-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run backend tests
        run: ./gradlew clean test

      - name: Build Spring Boot JAR
        run: ./gradlew bootJar

      - name: Prepare backend artifact
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "Spring Boot JAR not found"
            exit 1
          fi

          cp "$JAR_FILE" stockwatch.jar
          ls -lh stockwatch.jar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockwatch-backend
          path: stockwatch.jar
          retention-days: 7

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockwatch-frontend
          path: frontend/dist/
          retention-days: 7

  deploy-backend:
    name: Deploy Backend to EC2

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'

    needs:
      - build

    runs-on: ubuntu-latest

    environment:
      name: production-backend
      url: https://api.stockwatch.mehedi.dk

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: stockwatch-backend
          path: backend-artifact

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/stockwatch.pem
          chmod 600 ~/.ssh/stockwatch.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp \
            -i ~/.ssh/stockwatch.pem \
            backend-artifact/stockwatch.jar \
            "$EC2_USER@$EC2_HOST:/home/$EC2_USER/stockwatch-new.jar"

      - name: Deploy, verify, and rollback if needed
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/stockwatch.pem \
            "$EC2_USER@$EC2_HOST" \
            'bash -s' <<'EOF'

          set -e

          echo "Stopping StockWatch..."
          sudo systemctl stop stockwatch

          echo "Creating backup..."
          if [ -f /opt/stockwatch/stockwatch.jar ]; then
              sudo cp \
                  /opt/stockwatch/stockwatch.jar \
                  /opt/stockwatch/stockwatch-backup.jar
          fi

          echo "Installing new JAR..."
          sudo mv \
              /home/ec2-user/stockwatch-new.jar \
              /opt/stockwatch/stockwatch.jar

          echo "Starting StockWatch..."
          sudo systemctl start stockwatch

          echo "Waiting for health check..."
          HEALTHY=false

          for attempt in $(seq 1 12); do
              if curl \
                  --fail \
                  --silent \
                  --show-error \
                  http://localhost:8081/api/auth/csrf \
                  > /dev/null
              then
                  HEALTHY=true
                  break
              fi

              echo "Health check attempt $attempt/12 failed; retrying..."
              sleep 5
          done

          if [ "$HEALTHY" = "true" ]; then
              echo "StockWatch backend is healthy."
              exit 0
          fi

          echo "New deployment failed health checks."
          sudo journalctl \
              -u stockwatch \
              -n 100 \
              --no-pager

          if [ -f /opt/stockwatch/stockwatch-backup.jar ]; then
              echo "Rolling back to previous JAR..."
              sudo systemctl stop stockwatch
              sudo cp \
                  /opt/stockwatch/stockwatch-backup.jar \
                  /opt/stockwatch/stockwatch.jar
              sudo systemctl start stockwatch
          fi

          exit 1
          EOF

  deploy-frontend:
    name: Deploy Frontend to Simply.com

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'

    needs:
      - build
      - deploy-backend

    runs-on: ubuntu-latest

    environment:
      name: production-frontend
      url: https://stockwatch.mehedi.dk

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: stockwatch-frontend
          path: frontend-dist

      - name: Deploy frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.simply.com
          username: ${{ secrets.SIMPLY_FTP_USER }}
          password: ${{ secrets.SIMPLY_FTP_PASS }}
          local-dir: ./frontend-dist/
          server-dir: /stockwatch/
